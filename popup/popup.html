<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title id="popup-title">YouTube AI Helper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      padding: 22px;
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f4f5fb;
      color: #333;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .header-icon { width: 44px; height: 44px; flex-shrink: 0; }

    .header-text h1 { font-size: 15px; font-weight: 800; color: #222; }
    .header-text p  { font-size: 12px; color: #5f6470; margin-top: 2px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e6f4ea;
      color: #1e7e34;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #28a745;
      border-radius: 50%;
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .steps {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .steps-title {
      font-size: 11px;
      font-weight: 700;
      color: #111;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .step {
      display: flex;
      gap: 11px;
      margin-bottom: 11px;
      align-items: flex-start;
    }

    .step:last-child { margin-bottom: 0; }

    .step-num {
      width: 22px;
      height: 22px;
      background: #111;
      color: #FFD400;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-text {
      font-size: 13px;
      line-height: 1.55;
      color: #444;
    }

    /* 형광펜처럼 노란 밑줄로 강조 (로고 색과 통일) */
    .step-text strong { color: #111; background: linear-gradient(transparent 55%, #FFE566 55%); }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .feature {
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #555;
      font-weight: 500;
      line-height: 1.4;
    }

    .feature .feat-icon { font-size: 18px; margin-bottom: 4px; display: block; }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #5f6470;
    }
  </style>
</head>
<body>
  <div class="header">
    <!-- tools/logo/logo.svg와 같은 로고 -->
    <svg class="header-icon" viewBox="70 146 884 788" aria-hidden="true">
      <path fill="#FFD400" stroke="#111111" stroke-width="48" stroke-linejoin="round" d="M212 178H812C876 178 922 224 922 288V646C922 710 876 756 812 756H497L282 902L318 756H212C148 756 102 710 102 646V288C102 224 148 178 212 178Z"/>
      <path d="M426 320V618L676 469L426 320Z" fill="#111111"/>
    </svg>
    <div class="header-text">
      <h1 id="header-title">YouTube AI Helper</h1>
      <p id="header-subtitle">AI points at the button for you</p>
    </div>
  </div>

  <div class="status-badge">
    <div class="status-dot"></div>
    <span id="status-badge-text">Works on YouTube</span>
  </div>

  <div class="steps">
    <div class="steps-title" id="steps-title">How to use</div>
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text" id="step-1"></div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text" id="step-2"></div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text" id="step-3"></div>
    </div>
  </div>

  <div class="features">
    <div class="feature"><span class="feat-icon">👆</span><span id="feature-1"></span></div>
    <div class="feature"><span class="feat-icon">🎙</span><span id="feature-2"></span></div>
    <div class="feature"><span class="feat-icon">🔍</span><span id="feature-3"></span></div>
    <div class="feature"><span class="feat-icon">🔊</span><span id="feature-4"></span></div>
  </div>

  <div class="footer" id="footer-text"></div>
  <script src="popup.js"></script>
</body>
</html>
